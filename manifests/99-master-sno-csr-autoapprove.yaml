# 99-master-sno-csr-autoapprove.yaml
#
# HOMELAB SNO ONLY. Installs scripts/sno-csr-autoapprove.sh on the node and runs
# it at every boot: for one hour it approves this node's own kubelet CSRs, so a
# cluster powered off past its kubelet certificate expiry comes back without an
# SSH session. See the header of that script for why OpenShift won't do this by
# itself, and why that's the right default everywhere except a single node you own.
#
# Applying or deleting this MachineConfig REBOOTS THE NODE. Do it when you can
# afford ten minutes of downtime.
#
#   oc apply  -f manifests/99-master-sno-csr-autoapprove.yaml
#   oc delete -f manifests/99-master-sno-csr-autoapprove.yaml   # remove it
#
# The script is embedded below as base64. If you edit
# scripts/sno-csr-autoapprove.sh, regenerate the `source:` line with:
#
#   echo "data:text/plain;charset=utf-8;base64,$(base64 < scripts/sno-csr-autoapprove.sh | tr -d '\n')"
#
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-master-sno-csr-autoapprove
  labels:
    machineconfiguration.openshift.io/role: master
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - path: /usr/local/bin/sno-csr-autoapprove.sh
          mode: 493          # 0755
          overwrite: true
          contents:
            source: data:text/plain;charset=utf-8;base64,
    systemd:
      units:
        - name: sno-csr-autoapprove.service
          enabled: true
          contents: |
            [Unit]
            Description=Approve this node's own kubelet CSRs after boot (homelab SNO only)
            After=kubelet.service network-online.target
            Wants=network-online.target

            [Service]
            Type=simple
            ExecStart=/usr/local/bin/sno-csr-autoapprove.sh
            Restart=no

            [Install]
            WantedBy=multi-user.target
