---
# =============================================================================
# Cloudflare API token for cert-manager DNS-01 challenge
# Author: Ryan Nix <ryan.nix@gmail.com>
# Repo:   https://github.com/ryannix123/single-node-openshift
#
# Create the token at https://dash.cloudflare.com/profile/api-tokens
# using the "Edit zone DNS" template, scoped to the openshifthelp.com zone.
# Permissions needed: Zone:DNS:Edit (+ Zone:Zone:Read).
#
# DO NOT COMMIT THE REAL TOKEN. Two safer options:
#   1. Apply this file locally after pasting the token, and keep it out of git
#      (see .gitignore note in README.md), or
#   2. Create the secret imperatively without a file:
#        oc create secret generic cloudflare-api-token \
#          --from-literal=api-token=YOUR_TOKEN_HERE \
#          -n cert-manager
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
type: Opaque
stringData:
  api-token: YOUR_TOKEN_HERE
