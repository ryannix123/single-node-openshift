---
# =============================================================================
# Single Node OpenShift - Day 2 Operations Playbook
# Author: Ryan Nix <ryan.nix@gmail.com>
# Repo:   https://github.com/ryannix123/single-node-openshift
#
# Prerequisites:
#   ansible-galaxy collection install kubernetes.core community.general
#
# Usage:
#   ansible-playbook sno-day2.yml
#
# This playbook talks to the cluster ENTIRELY through `oc` / the Kubernetes API.
# It no longer SSHes into the node — disk wiping is delegated to the LVM Storage
# operator via `forceWipeDevicesAndDestroyAllData`, so there is no SSH key to
# manage and no way to accidentally wipe the OS disk from a shell task.
#
# Overrides (use -e or -e @my-vars.yml):
#   storage_device        - Target disk. EMPTY = operator auto-discovers an
#                           empty disk (safest). Set to a /dev/disk/by-id/ path
#                           to target a specific disk.          (default: "")
#   storage_force_wipe    - Wipe existing data on storage_device (default: true)
#   validate_storage_device - oc-debug guard vs. the OS disk    (default: true)
#   storage_class         - LVM StorageClass name        (default: lvms-<vg>)
#   lvm_channel           - Operator subscription channel (default: stable-4.21)
#   registry_size         - Image registry PVC size       (default: 100Gi)
#   monitoring_size       - Prometheus PVC size           (default: 40Gi)
#
# See vars/defaults.yml for all variables.
# =============================================================================
- name: SNO Day 2 Operations
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/vars/defaults.yml"

  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ kubeconfig }}"
    kubernetes.core.k8s_info:
      kubeconfig: "{{ kubeconfig }}"
    kubernetes.core.k8s_json_patch:
      kubeconfig: "{{ kubeconfig }}"

  tasks:

    # --------------------------------------------------------------------------
    # 0. Pre-flight checks
    # --------------------------------------------------------------------------
    - name: Verify oc / kubectl is available
      ansible.builtin.command: oc version --client
      register: oc_version
      changed_when: false
      failed_when: oc_version.rc != 0

    - name: Verify cluster is reachable
      kubernetes.core.k8s_info:
        kind: Node
      register: nodes
      failed_when: nodes.resources | length == 0

    - name: Set sno_node fact
      ansible.builtin.set_fact:
        sno_node: "{{ nodes.resources[0].metadata.name }}"

    - name: Determine storage selection mode
      ansible.builtin.set_fact:
        explicit_device: "{{ (storage_device | default('') | length > 0) }}"

    - name: Report storage selection mode
      ansible.builtin.debug:
        msg: >-
          {{ 'Explicit device: ' ~ storage_device ~
             ' (forceWipe=' ~ (storage_force_wipe | bool) ~ ')'
             if (explicit_device | bool)
             else 'Auto-discovery: operator will claim an empty disk on ' ~ sno_node ~
                  ' (it never selects disks that already hold data).' }}

    # --------------------------------------------------------------------------
    # 0a. AUTO-DISCOVERY GUARD — refuse to guess when >1 empty disk exists.
    #     In auto mode LVMS claims ALL empty disks; a 0B card reader or an empty
    #     USB/SD slot will poison `vgcreate` ("Cannot use /dev/sda: device not
    #     found. Command requires all devices to be found."). Fail fast and tell
    #     the user to pin the real data disk. Runs only in auto-discovery mode.
    # --------------------------------------------------------------------------
    - name: "Auto-discovery — list block devices on {{ sno_node }}"
      ansible.builtin.command:
        argv:
          - oc
          - debug
          - "node/{{ sno_node }}"
          - "--"
          - chroot
          - /host
          - lsblk
          - --json
          - --paths
          - -o
          - NAME,TYPE,SIZE,FSTYPE
      register: auto_lsblk
      changed_when: false
      when: not (explicit_device | bool)

    - name: "Auto-discovery — compute eligible empty disks"
      ansible.builtin.set_fact:
        auto_candidates: >-
          {{ (auto_lsblk.stdout | from_json).blockdevices
             | selectattr('type', 'equalto', 'disk')
             | rejectattr('children', 'defined')
             | selectattr('fstype', 'in', [none, ''])
             | list }}
      when: not (explicit_device | bool)

    - name: "Auto-discovery — require exactly one eligible disk"
      ansible.builtin.assert:
        that:
          - auto_candidates | length == 1
        fail_msg: >-
          Auto-discovery found {{ auto_candidates | length }} empty disk(s) on
          {{ sno_node }}: {{ auto_candidates | map(attribute='name')
          | zip(auto_candidates | map(attribute='size')) | map('join', ' ')
          | join('; ') }}. LVMS would try to use ALL of them and vgcreate fails
          if any is a 0B card reader or a removable slot. Re-run pinned to the
          real data disk, e.g. -e storage_device=/dev/disk/by-id/nvme-XXXX
          (list them with: oc debug node/{{ sno_node }} -- chroot /host ls -l /dev/disk/by-id/).
        success_msg: >-
          One eligible disk found: {{ auto_candidates[0].name }}
          ({{ auto_candidates[0].size }}) — safe to auto-discover.
        quiet: true
      when: not (explicit_device | bool)

    # --------------------------------------------------------------------------
    # 0b. SAFETY GUARD — never wipe the OS disk
    #     Runs only when an explicit device is set and validation is enabled.
    #     Uses `oc debug node` (API-based, no SSH) to inspect the node.
    # --------------------------------------------------------------------------
    - name: "Guard — find which whole-disks host the OS on {{ sno_node }}"
      ansible.builtin.command:
        argv:
          - oc
          - debug
          - "node/{{ sno_node }}"
          - "--"
          - chroot
          - /host
          - bash
          - "-c"
          - >-
            for mp in / /boot /sysroot /var /etc; do
            s=$(findmnt -fno SOURCE "$mp" 2>/dev/null) || true;
            [ -n "$s" ] && lsblk -no PKNAME "$s" 2>/dev/null;
            done | sort -u
      register: os_disks
      changed_when: false
      when:
        - explicit_device | bool
        - validate_storage_device | bool

    - name: "Guard — resolve {{ storage_device }} to a kernel device name"
      ansible.builtin.command:
        argv:
          - oc
          - debug
          - "node/{{ sno_node }}"
          - "--"
          - chroot
          - /host
          - bash
          - "-c"
          - "lsblk -ndo KNAME {{ storage_device }} 2>/dev/null"
      register: target_kname
      changed_when: false
      failed_when: false
      when:
        - explicit_device | bool
        - validate_storage_device | bool

    - name: "Guard — target storage device must exist on {{ sno_node }}"
      ansible.builtin.assert:
        that:
          - target_kname.stdout | trim | length > 0
        fail_msg: >-
          storage_device '{{ storage_device }}' was not found on {{ sno_node }}.
          List valid stable paths with:
          oc debug node/{{ sno_node }} -- chroot /host ls -l /dev/disk/by-id/
        quiet: true
      when:
        - explicit_device | bool
        - validate_storage_device | bool

    - name: "Guard — REFUSE to wipe a disk that hosts the OS"
      ansible.builtin.assert:
        that:
          - (target_kname.stdout | trim) not in (os_disks.stdout_lines | map('trim') | list)
        fail_msg: >-
          REFUSING to proceed. storage_device '{{ storage_device }}'
          (kernel device {{ target_kname.stdout | trim }}) backs an OS mount on
          {{ sno_node }} [OS disks: {{ os_disks.stdout_lines | join(', ') }}].
          Point storage_device at your DATA disk, not the boot disk.
        success_msg: >-
          Safe: {{ storage_device }} ({{ target_kname.stdout | trim }})
          is not an OS disk.
        quiet: true
      when:
        - explicit_device | bool
        - validate_storage_device | bool

    # --------------------------------------------------------------------------
    # 1. Install the LVM Storage Operator
    # --------------------------------------------------------------------------
    - name: Create LVM Storage namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ lvm_namespace }}"
            labels:
              openshift.io/cluster-monitoring: "true"

    - name: Create LVM Operator OperatorGroup
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: openshift-lvm-storage-operatorgroup
            namespace: "{{ lvm_namespace }}"
          spec:
            targetNamespaces:
              - "{{ lvm_namespace }}"

    - name: Create LVM Operator Subscription
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: lvms-operator
            namespace: "{{ lvm_namespace }}"
          spec:
            channel: "{{ lvm_channel }}"
            installPlanApproval: Automatic
            name: lvms-operator
            source: redhat-operators
            sourceNamespace: openshift-marketplace

    - name: Wait for LVM InstallPlan to be created
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: InstallPlan
        namespace: "{{ lvm_namespace }}"
      register: lvm_installplan
      retries: 20
      delay: 10
      until: lvm_installplan.resources | length > 0

    - name: Approve any pending LVM InstallPlans
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: InstallPlan
          metadata:
            name: "{{ item.metadata.name }}"
            namespace: "{{ lvm_namespace }}"
          spec:
            approved: true
      loop: "{{ lvm_installplan.resources }}"
      when: not item.spec.approved

    - name: Show LVM subscription status (debug)
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: Subscription
        name: lvms-operator
        namespace: "{{ lvm_namespace }}"
      register: lvm_sub_debug

    - name: Print LVM subscription state
      ansible.builtin.debug:
        msg:
          - "currentCSV:   {{ lvm_sub_debug.resources[0].status.currentCSV | default('not set') }}"
          - "installedCSV: {{ lvm_sub_debug.resources[0].status.installedCSV | default('not set') }}"
          - "state:        {{ lvm_sub_debug.resources[0].status.state | default('not set') }}"

    - name: Wait for LVM Operator CSV to succeed
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: "{{ lvm_namespace }}"
      register: lvm_csv
      retries: "{{ operator_retries }}"
      delay: "{{ operator_delay }}"
      until: >
        lvm_csv.resources | length > 0 and
        lvm_csv.resources | map(attribute='status.phase') | select('equalto', 'Succeeded') | list | length > 0

    # --------------------------------------------------------------------------
    # 2. Create LVMCluster
    #    The operator does the disk wiping. When storage_device is set we pass an
    #    explicit deviceSelector with forceWipeDevicesAndDestroyAllData; when it
    #    is empty we omit deviceSelector and let the operator auto-discover an
    #    empty disk (it will never claim a disk that already holds data).
    # --------------------------------------------------------------------------
    - name: Build LVM deviceClass definition
      ansible.builtin.set_fact:
        lvm_device_class: >-
          {{
            {
              'name': lvm_vg_name,
              'default': true,
              'thinPoolConfig': {
                'name': lvm_thinpool_name,
                'sizePercent': lvm_size_percent | int,
                'overprovisionRatio': lvm_overprovision_ratio | int
              }
            } | combine(
              {
                'deviceSelector': {
                  'paths': [storage_device],
                  'forceWipeDevicesAndDestroyAllData': (storage_force_wipe | bool)
                }
              } if (explicit_device | bool) else {}
            )
          }}

    - name: Create LVMCluster
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: lvm.topolvm.io/v1alpha1
          kind: LVMCluster
          metadata:
            name: "{{ lvm_cluster_name }}"
            namespace: "{{ lvm_namespace }}"
          spec:
            storage:
              deviceClasses: "{{ [lvm_device_class] }}"

    - name: Show raw LVMCluster status (debug)
      ansible.builtin.command: >
        oc get lvmcluster {{ lvm_cluster_name }} -n {{ lvm_namespace }} -o jsonpath='{.status}'
      register: lvmcluster_raw
      changed_when: false

    - name: Print LVMCluster raw status
      ansible.builtin.debug:
        msg: "{{ lvmcluster_raw.stdout }}"

    - name: Wait for LVMCluster to become Ready
      ansible.builtin.command: >
        oc get lvmcluster {{ lvm_cluster_name }} -n {{ lvm_namespace }}
        -o jsonpath='{.status.state}'
      register: lvm_ready
      retries: "{{ operator_retries }}"
      delay: "{{ operator_delay }}"
      until: lvm_ready.stdout == "Ready"
      changed_when: false

    # --------------------------------------------------------------------------
    # 3. Set the LVMS StorageClass as the cluster default
    # --------------------------------------------------------------------------
    - name: Get names of any currently-default StorageClasses
      ansible.builtin.command: >
        oc get sc -o jsonpath='{.items[?(@.metadata.annotations.storageclass\.kubernetes\.io/is-default-class=="true")].metadata.name}'
      register: current_defaults
      changed_when: false

    - name: Remove default annotation from existing default StorageClasses
      ansible.builtin.command: >
        oc annotate sc {{ item }} storageclass.kubernetes.io/is-default-class=false --overwrite
      loop: "{{ current_defaults.stdout.split() | reject('equalto', storage_class) | list }}"
      when: current_defaults.stdout | length > 0

    - name: "Set {{ storage_class }} as the default StorageClass"
      ansible.builtin.command: >
        oc annotate sc {{ storage_class }} storageclass.kubernetes.io/is-default-class=true --overwrite
      register: sc_annotate
      changed_when: "'annotated' in sc_annotate.stdout"

    - name: Verify default StorageClass is set
      ansible.builtin.command: oc get sc
      register: sc_list
      changed_when: false

    - name: Print StorageClasses
      ansible.builtin.debug:
        msg: "{{ sc_list.stdout_lines }}"

    # --------------------------------------------------------------------------
    # 4. Patch the image registry to use persistent storage
    # --------------------------------------------------------------------------
    - name: Create PVC for image registry
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: image-registry-storage
            namespace: openshift-image-registry
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: "{{ registry_size }}"
            storageClassName: "{{ storage_class }}"

    - name: Patch image registry - enable managed state and PVC storage
      ansible.builtin.command: >
        oc patch configs.imageregistry.operator.openshift.io/cluster --type=merge
        -p '{"spec":{"managementState":"Managed","storage":{"pvc":{"claim":"image-registry-storage"}},"rolloutStrategy":"Recreate","replicas":1}}'
      changed_when: true

    - name: Wait for image registry to be Available
      ansible.builtin.command: >
        oc get configs.imageregistry.operator.openshift.io cluster
        -o jsonpath='{.status.conditions[?(@.type=="Available")].status}'
      register: registry_status
      retries: "{{ operator_retries }}"
      delay: "{{ operator_delay }}"
      until: registry_status.stdout == "True"
      changed_when: false

    # --------------------------------------------------------------------------
    # 5. Patch cluster monitoring to use persistent storage
    # --------------------------------------------------------------------------
    - name: Create or update cluster-monitoring-config ConfigMap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: cluster-monitoring-config
            namespace: openshift-monitoring
          data:
            config.yaml: |
              prometheusK8s:
                retention: {{ monitoring_retention }}
                volumeClaimTemplate:
                  metadata:
                    name: prometheus-k8s-data
                  spec:
                    storageClassName: {{ storage_class }}
                    resources:
                      requests:
                        storage: {{ monitoring_size }}
              alertmanagerMain:
                volumeClaimTemplate:
                  metadata:
                    name: alertmanager-data
                  spec:
                    storageClassName: {{ storage_class }}
                    resources:
                      requests:
                        storage: {{ alertmanager_size }}

    - name: Wait for Prometheus pods to be Running
      ansible.builtin.command: >
        oc get pods -n openshift-monitoring -l app.kubernetes.io/name=prometheus
        --field-selector=status.phase=Running --no-headers
      register: prom_pods
      retries: "{{ operator_retries }}"
      delay: "{{ operator_delay }}"
      until: prom_pods.stdout_lines | length > 0
      changed_when: false

    # --------------------------------------------------------------------------
    # 6. Install OpenShift Virtualization
    # --------------------------------------------------------------------------
    - name: Create openshift-cnv namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: openshift-cnv
            labels:
              openshift.io/cluster-monitoring: "true"

    - name: Create CNV OperatorGroup
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: kubevirt-hyperconverged-group
            namespace: openshift-cnv
          spec:
            targetNamespaces:
              - openshift-cnv

    - name: Create CNV Subscription
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: hco-operatorhub
            namespace: openshift-cnv
          spec:
            channel: stable
            installPlanApproval: Automatic
            name: kubevirt-hyperconverged
            source: redhat-operators
            sourceNamespace: openshift-marketplace

    - name: Fetch CSVs in openshift-cnv (debug)
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: openshift-cnv
      register: cnv_csv_debug

    - name: Wait for CNV CSV to succeed
      ansible.builtin.command: >
        oc get csv -n openshift-cnv
        -o jsonpath='{.items[?(@.status.phase=="Succeeded")].metadata.name}'
      register: cnv_csv
      retries: "{{ operator_retries }}"
      delay: "{{ operator_delay }}"
      until: cnv_csv.stdout | length > 0
      changed_when: false

    - name: Create HyperConverged instance
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: hco.kubevirt.io/v1beta1
          kind: HyperConverged
          metadata:
            name: kubevirt-hyperconverged
            namespace: openshift-cnv
          spec:
            enableCommonBootImageImport: true

    - name: Wait for HyperConverged to be Available
      ansible.builtin.command: >
        oc get hyperconverged kubevirt-hyperconverged -n openshift-cnv
        -o jsonpath='{.status.conditions[?(@.type=="Available")].status}'
      register: hco_status
      retries: "{{ operator_retries }}"
      delay: "{{ operator_delay }}"
      until: hco_status.stdout == "True"
      changed_when: false

    # --------------------------------------------------------------------------
    # Summary
    # --------------------------------------------------------------------------
    - name: Print completion summary
      ansible.builtin.debug:
        msg:
          - "{{ 'Storage disk: ' ~ storage_device ~ ' (wiped by operator, forceWipe=' ~ (storage_force_wipe | bool) ~ ')' if (explicit_device | bool) else 'Storage disk: auto-discovered empty disk on ' ~ sno_node }}"
          - "LVM Storage Operator installed ({{ lvm_channel }})"
          - "LVMCluster '{{ lvm_cluster_name }}' created and Ready"
          - "StorageClass {{ storage_class }} set as cluster default"
          - "Image registry patched -> {{ registry_size }} PVC"
          - "Cluster monitoring patched -> {{ monitoring_size }} PVC ({{ monitoring_retention }} retention)"
          - "OpenShift Virtualization installed and HyperConverged is Available"